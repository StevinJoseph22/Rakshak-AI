name: rakshak_mobile
description: "Rakshak-AI Emergency Crash Detection & SOS Alert Mobile Application"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sensors_plus: ^7.1.0
  image_picker: ^1.2.3
  http: ^1.6.0
  geolocator: ^14.0.3
  socket_io_client: ^3.1.6
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  path_provider_android: 2.2.17

flutter:
  uses-material-design: true
