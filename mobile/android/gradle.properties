org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable automatic SDK/NDK download to prevent deprecated sdkmanager crash
android.builder.sdkDownload=false

# Disable Kotlin incremental compilation to resolve cross-drive (C: cache vs E: project) root mismatch bug on Windows
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# Tolerate JVM target mismatch in third-party plugins (e.g. tflite_flutter compileDebugKotlin vs Java 11)
kotlin.jvm.target.validation.mode=warning

