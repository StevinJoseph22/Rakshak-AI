[project]
name = "rakshak-triage-service"
version = "0.1.0"
description = "Rakshak-AI Geospatial Matching and Emergency Triage Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "httpx>=0.27.0",
    "redis>=5.0.6",
    "asyncpg>=0.29.0",
    "shapely>=2.0.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "black>=24.4.2",
    "pytest>=8.2.2",
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]
